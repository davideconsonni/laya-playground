[project]
name = "laya-playground"
version = "0.1.0"
description = "Laya playground: choose the solution given a problem (CPU/GPU, tournament, stability)"
requires-python = ">=3.10"
dependencies = [
    "laya[serve]>=0.4.9",
    "torch>=2.14",
]

[tool.uv]
# The project is not an installable package: `uv sync` only manages the dependencies.
package = false

# PyTorch CUDA: in a uv project the backend is declared with an explicit index, not with
# `--torch-backend` (which only applies to `uv pip`). cu130 is the latest channel published with
# torch 2.14.1 for Windows/cp312 and is compatible with the CUDA 13.4 driver on this machine.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
